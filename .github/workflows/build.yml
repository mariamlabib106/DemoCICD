name: Demo CI/CD Pipeline

on:
  push:
    branches:
      - production

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore Dependencies
        run: dotnet restore DemoCICD.sln

      - name: Build Project
        run: dotnet build DemoCICD.sln --configuration Release --no-restore

      - name: Publish Project
        run: dotnet publish DemoCICD/DemoCICD.csproj --configuration Release --output ./publish

      - name: Install jq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Generate Docker Version
        id: version
        run: |
          IMAGE="mariamlabib10/democicd"

          LAST_TAG=$(curl -s "https://hub.docker.com/v2/repositories/${IMAGE}/tags?page_size=100" \
            | jq -r '.results[].name' \
            | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' \
            | sort -V \
            | tail -n 1)

          if [ -z "$LAST_TAG" ]; then
            VERSION="0.0.0"
          else
            IFS='.' read -r MAJOR MINOR PATCH <<< "$LAST_TAG"
            PATCH=$((PATCH + 1))
            VERSION="$MAJOR.$MINOR.$PATCH"
          fi

          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Generated version: $VERSION"

      - name: Build Docker Image
        run: |
          docker build \
            -t mariamlabib10/democicd:${{ env.VERSION }} \
            ./DemoCICD

      - name: Push Docker Image
        run: |
          docker push mariamlabib10/democicd:${{ env.VERSION }}

      - name: Show Published Version
        run: |
          echo "Published Docker Image: mariamlabib10/democicd:${{ env.VERSION }}"

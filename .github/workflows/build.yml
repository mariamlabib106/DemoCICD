name: Demo CI/CD Pipeline

on:
  push:
    branches:
      - production

  workflow_dispatch:
    inputs:
      version_type:
        description: "Select version to increment"
        required: true
        default: "patch"
        type: choice
        options:
          - major
          - minor
          - patch

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore Dependencies
        run: dotnet restore DemoCICD.sln

      - name: Build Project
        run: dotnet build DemoCICD.sln --configuration Release --no-restore

      - name: Publish Project
        run: dotnet publish DemoCICD/DemoCICD.csproj --configuration Release --output ./publish

      - name: Install jq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Generate Docker Version
        run: |
          IMAGE="mariamlabib10/democicd"

          LAST_TAG=$(curl -s "https://hub.docker.com/v2/repositories/${IMAGE}/tags?page_size=100" \
            | jq -r '.results[].name' \
            | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' \
            | sort -V \
            | tail -n1)

          if [ -z "$LAST_TAG" ]; then
            MAJOR=0
            MINOR=0
            PATCH=0
          else
            IFS='.' read -r MAJOR MINOR PATCH <<< "$LAST_TAG"
          fi

          VERSION_TYPE="${{ github.event.inputs.version_type }}"

          if [ -z "$VERSION_TYPE" ]; then
            VERSION_TYPE="patch"
          fi

          case "$VERSION_TYPE" in
            major)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;
            minor)
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;
            patch)
              PATCH=$((PATCH + 1))
              ;;
          esac

          VERSION="$MAJOR.$MINOR.$PATCH"

          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Generated Version: $VERSION"

      - name: Build Docker Image
        run: |
          docker build \
            -t mariamlabib10/democicd:${{ env.VERSION }} \
            ./DemoCICD

      - name: Push Docker Image
        run: |
          docker push mariamlabib10/democicd:${{ env.VERSION }}

      - name: Show Published Version
        run: |
          echo "Published Docker Image: mariamlabib10/democicd:${{ env.VERSION }}"
